<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- Equip wordmark — Literata, ink, sage accent line.
       Was Fraunces in violet: neither the face nor the hue is the product's
       any more. Literata is the serif the interface actually sets. -->
  <text x="0" y="46" font-family="Literata, Georgia, Cambria, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#1E1C1A" letter-spacing="-0.5">Equip</text>
  <rect x="0" y="56" width="124" height="2" fill="#4E6E55"/>
</svg>
