<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="canonical" href="https://equipbible.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Equip is systematic Bible study for people who take Scripture seriously. Courses, progress, certificates. English, Russian, German, Ukrainian." />
    <meta name="theme-color" content="#422277" />

    <!-- Alternates for search engines. The app is one URL per page in
         every language (the locale lives in the profile, not the path),
         so x-default points at the same place: the site itself decides,
         from the visitor's browser, which language to open in. -->
    <link rel="alternate" hreflang="ru" href="https://equipbible.com/" />
    <link rel="alternate" hreflang="en" href="https://equipbible.com/" />
    <link rel="alternate" hreflang="de" href="https://equipbible.com/" />
    <link rel="alternate" hreflang="uk" href="https://equipbible.com/" />
    <link rel="alternate" hreflang="x-default" href="https://equipbible.com/" />

    <!-- Open Graph + Twitter share-preview cards. Static defaults are
         intentional: the SPA renders client-side, so anything dynamic
         set by React would be invisible to the unfurlers (FB, LinkedIn,
         Slack, Telegram, X) which only fetch the raw HTML. og:image
         is a 29 KB JPEG (1200x630) compressed from the dev.to cover. -->
    <meta property="og:title" content="Equip — изучение Библии" />
    <meta property="og:description" content="Системное изучение Библии: курсы, главы, тесты, сертификаты. Бесплатно." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://equipbible.com/" />
    <meta property="og:image" content="https://equipbible.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Equip — современная платформа для изучения Библии" />
    <meta property="og:site_name" content="Equip" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Equip — изучение Библии" />
    <meta name="twitter:description" content="Системное изучение Библии: курсы, главы, тесты, сертификаты. Бесплатно." />
    <meta name="twitter:image" content="https://equipbible.com/og-image.jpg" />

    <!-- Schema.org structured data for Google. Three pieces:
           1. Organization — entity profile (logo, name, url).
           2. WebSite — declares the search URL pattern so Google
              renders the sitelinks search box under our main result
              when the SERP shows a brand query like "equipbible".
              The query maps to /courses?search={...} which the
              catalog page already supports.
           3. EducationalOrganization — extra signal for the
              "учебная платформа" classification. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://equipbible.com/#organization",
          "name": "Equip",
          "url": "https://equipbible.com/",
          "logo": "https://equipbible.com/icon.svg",
          "description": "Системное изучение Библии для тех, кто относится к Писанию серьёзно."
        },
        {
          "@type": "WebSite",
          "@id": "https://equipbible.com/#website",
          "url": "https://equipbible.com/",
          "name": "Equip",
          "inLanguage": ["ru-RU", "en-US"],
          "publisher": { "@id": "https://equipbible.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://equipbible.com/courses?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "EducationalOrganization",
          "@id": "https://equipbible.com/#edu",
          "name": "Equip",
          "url": "https://equipbible.com/",
          "logo": "https://equipbible.com/icon.svg",
          "sameAs": ["https://github.com/ArVaViT/equip"]
        }
      ]
    }
    </script>

    <title>Equip — study the Bible online</title>

    <!-- Decides the visitor's language before the bundle loads, and sets
         the three things that exist this early: <html lang>, the tab
         title, and the description above. Without it every visitor got
         the static title until React booted and corrected it — which is
         the render-then-translate flicker this product does not accept
         anywhere else.

         The static values above are English, and deliberately so: they
         are what a reader gets when this script never runs (JavaScript
         off, a blocked request), which is the same "we know nothing
         about you" case DEFAULT_LOCALE answers in src/i18n/config.ts.
         The og:/twitter: cards and the JSON-LD below are a separate
         decision and stay in Russian — they address unfurlers and search
         engines, not a visitor whose browser told us anything.

         Generated from the locale catalogs by
         scripts/build-locale-boot.mjs; a file rather than an inline
         block because the CSP is script-src 'self'. -->
    <script src="/locale-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
