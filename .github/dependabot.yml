# Dependabot automatically opens pull requests to keep dependencies up to date
# and patch known vulnerabilities. Each ecosystem block below controls update
# cadence for a different part of the monorepo.
#
# Grouping strategy: minor/patch upgrades are batched into one PR per ecosystem
# to keep review load manageable; major upgrades always get their own PR so
# breaking changes get individual attention.
#
# Cooldown: a release is not taken the day it is published. Minor and patch
# bumps (the ones `dependabot-auto-merge.yml` merges on green) wait a week,
# majors two — long enough for a yanked release or a hijacked package to be
# noticed upstream before it is pulled into main. Security updates ignore
# the cooldown, so an advisory still lands right away.
version: 2

updates:
  # Frontend (React + Vite + Supabase JS) -------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # React-ecosystem packages tend to need to move in lockstep; batching
      # them avoids ping-pong PRs where one package bumps and its peer dep
      # spec rejects the version.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react*"
      radix:
        patterns:
          - "@radix-ui/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      supabase:
        patterns:
          - "@supabase/*"
      # @datadog/browser-rum and @datadog/browser-rum-react share an internal
      # @datadog/browser-rum-core peer; bumping them out of sync produces a
      # type-mismatch (two copies of the RumPlugin type), so they have to move
      # together.
      datadog:
        patterns:
          - "@datadog/*"
      dev-types:
        dependency-type: "development"
        patterns:
          - "@types/*"
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "eslint*"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "prettier"
          - "typescript"
    ignore:
      # zod 4.6 adds 6kB to the `schemas` chunk and trips the bundle
      # sentinel (17.2 -> 23.4kB, budget 20). Held at ~4.4.3 until the
      # budget or the schemas are reconsidered on purpose.
      - dependency-name: "zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Hold major bumps back — they almost always need a codemod or config
      # migration (e.g. React 19, Vite 6, react-router v7 renamed APIs).
      # Major bumps are opened manually when we're ready to do the migration.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hello-pangea/dnd"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is out, but i18next 26.x still declares a peer range of
      # `^5 || ^6`, so npm's resolver refuses the install outright (ERESOLVE)
      # and every dev-tooling group PR dies before a single test runs. Lift
      # this once i18next widens the range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Backend (FastAPI + SQLAlchemy + Supabase Py) -----------------------------
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "starlette"
          - "pydantic*"
      sqlalchemy:
        patterns:
          - "sqlalchemy"
          - "psycopg2*"
      testing:
        patterns:
          - "pytest*"
          - "httpx"
          - "anyio"
      tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "types-*"
          - "pip-audit"
    ignore:
      # 2.1 is a minor by semver and a migration in practice: it makes
      # `postgresql://` mean psycopg 3 (this project ships psycopg2, so the
      # app cannot connect) and retypes rows (nine mypy errors). #1334 went
      # red on exactly that. Take it on purpose, in its own PR.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows --------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
