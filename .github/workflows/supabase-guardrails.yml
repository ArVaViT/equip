name: Supabase Guardrails

# Two things about the Supabase project that were previously invisible
# until they hurt:
#
#   advisors  — the weekly advisor email is easy to stop reading, and its
#               wording overstates severity, so real findings hide among
#               accepted ones. This applies the judgement (see the script)
#               and speaks only when something needs a person.
#   auth      — `rate_limit_email_sent` sat at 2 for months, blamed on the
#               platform. It is a config field. Now it lives in
#               supabase/config/auth.production.json and drift fails here.
#
# Checking is automatic and read-only. Writing is never automatic: applying
# the Auth config takes a deliberate manual run with apply=true.

on:
  schedule:
    # 06:40 UTC — after the edge-function drift check, before the day
    # starts in America/Indianapolis.
    - cron: "40 6 * * *"
  pull_request:
    branches: [main]
    paths:
      - "supabase/config/**"
      - ".github/scripts/supabase_advisors.py"
      - ".github/scripts/supabase_auth_config.py"
      - ".github/workflows/supabase-guardrails.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the Auth settings from supabase/config/auth.production.json to the project"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROJECT_REF: rrisqutxlkamwfhcashl

jobs:
  auth-config:
    name: auth config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check (or apply) Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "Applying — this writes to production Auth."
            python3 .github/scripts/supabase_auth_config.py --apply
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # A PR that changes a value is drifted until it is merged and
            # applied, so on PRs the difference is reported, not failed.
            python3 .github/scripts/supabase_auth_config.py --warn-only
          else
            python3 .github/scripts/supabase_auth_config.py
          fi

  advisors:
    name: advisors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The script reads table sizes itself through the Management API —
        # `supabase db query` would need a linked project and a database
        # password, and when that silently failed the foreign-key rule fired
        # seventeen times on empty tables.
        run: python3 .github/scripts/supabase_advisors.py
