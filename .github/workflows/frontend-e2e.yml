name: Frontend E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"

# Least-privilege token: this workflow only checks out the repo and uploads
# build artifacts (report/traces) — neither needs write scope. Declaring it
# at the top level denies everything else and clears the OpenSSF Scorecard
# "Token-Permissions" finding flagged on this file.
permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

# E2E is single-job because Playwright handles parallelism itself.
# We pin Node to the same minor as the rest of the CI matrix
# (frontend-ci.yml uses 22.18.0) so a bundler / browser-runtime mismatch
# can't introduce flakiness here that doesn't reproduce in dev.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve Playwright version
        # Cache key for the browser archive below — keyed on the exact
        # @playwright/test version from the lockfile so a Playwright bump
        # naturally invalidates the cache.
        id: playwright-version
        run: >-
          echo "version=$(node -p
          "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser archive
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        # ``--with-deps`` pulls the system libs (libnss, libxss, etc.)
        # the headless browser needs on Ubuntu. This step runs even on a
        # cache hit: the browser download is then a ~2s no-op, but the OS
        # deps still need installing on the fresh runner.
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        # Build + serve so the e2e suite runs against the production
        # bundle, not the dev HMR pipeline. Catches build-time issues
        # (missing tree-shake-safe markers, env wiring) the same way
        # a real prod deploy would.
        env:
          # Smoke tests don't hit a real backend, BUT the build must still
          # be given Supabase vars: src/lib/supabase.ts THROWS at module
          # load if VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are unset,
          # which blanks the whole SPA (React never mounts) and fails every
          # public-flow spec with "element not found". These are throwaway
          # placeholders — the public routes never call Supabase.
          VITE_API_URL: http://localhost:8000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-placeholder-anon-key-not-real
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 5173 &
          # Wait for the server to accept connections before launching
          # the test runner.
          npx wait-on http://127.0.0.1:5173 --timeout 60000

      - name: Run Playwright tests
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
