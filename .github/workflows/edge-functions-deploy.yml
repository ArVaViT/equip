name: Edge Functions Deploy

# Closes the gap `docs/DEPLOYMENT.md` used to describe and not solve: the
# code in `main` and the code sending users' email could differ for weeks
# with every check green. On 2026-09-01 three merged fixes to the email
# copy sat undeployed for exactly that reason, and nothing said so.
#
# Two jobs:
#   deploy — on every push to main that touches the function, so the
#            divergence cannot start.
#   drift  — daily, and on pull requests touching the function, so if it
#            ever starts anyway (a hand deploy, a failed run, a push that
#            skipped CI) somebody is told within a day.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-deploy.yml"
  schedule:
    # 06:20 UTC — early morning in America/Indianapolis, so a drift found
    # overnight is on screen before the day starts.
    - cron: "20 6 * * *"
  workflow_dispatch: {}

# Least privilege: this workflow reads the repo and talks to Supabase.
# It never writes to GitHub.
permissions:
  contents: read

env:
  PROJECT_REF: rrisqutxlkamwfhcashl
  FUNCTION_SLUG: send-email

jobs:
  deploy:
    name: deploy send-email
    # Only a real push to main deploys. Pull requests and the nightly run
    # take the drift job below instead — a PR must never be able to put
    # code in front of users before it is merged.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — the function cannot be deployed."
            exit 1
          fi
          supabase functions deploy "$FUNCTION_SLUG" --project-ref "$PROJECT_REF"

      - name: Confirm the deploy landed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/edge_function_drift.py --require-fresh

  drift:
    name: drift check
    # Not on Dependabot PRs: such runs get no SUPABASE_ACCESS_TOKEN (GitHub
    # withholds repository secrets from them), so the check fails before it
    # reaches Supabase. The paths filter includes this workflow file, which
    # is exactly what an actions bump edits.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'pull_request')
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares the deploy timestamp against the last commit
          # that touched the function, so it needs real history, not a
          # single-commit shallow clone.
          fetch-depth: 0

      - name: Compare production against main
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/edge_function_drift.py
