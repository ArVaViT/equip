name: Edge Functions Deploy

# Closes the gap `docs/DEPLOYMENT.md` used to describe and not solve: the
# code in `main` and the code sending users' email could differ for weeks
# with every check green. On 2026-09-01 three merged fixes to the email
# copy sat undeployed for exactly that reason, and nothing said so.
#
# Two jobs:
#   deploy — on every push to main that touches the function, so the
#            divergence cannot start.
#   drift  — daily, and on pull requests touching the function, so if it
#            ever starts anyway (a hand deploy, a failed run, a push that
#            skipped CI) somebody is told within a day.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-deploy.yml"
  schedule:
    # 06:20 UTC — early morning in America/Indianapolis, so a drift found
    # overnight is on screen before the day starts.
    - cron: "20 6 * * *"
  workflow_dispatch: {}

# Least privilege: this workflow reads the repo and talks to Supabase.
# It never writes to GitHub.
permissions:
  contents: read

env:
  PROJECT_REF: rrisqutxlkamwfhcashl
  FUNCTION_SLUG: send-email

jobs:
  deploy:
    name: deploy send-email
    # Only a real push to main deploys. Pull requests and the nightly run
    # take the drift job below instead — a PR must never be able to put
    # code in front of users before it is merged.
    # A manual run deploys too, but only from main — dispatching this
    # workflow on a branch must not put that branch in front of users.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # One deploy at a time, oldest first. Two merges seconds apart (as on
    # 2026-09-15, 02:22:42 and 02:22:53) otherwise deploy concurrently, and
    # the older commit can finish last and leave production behind main —
    # a state no timestamp comparison can see afterwards, since the older
    # code then carries the newer deploy time. Not cancelled in progress:
    # a deploy stopped halfway is worse than one that waits. A run still
    # waiting is replaced (shown as cancelled) when a newer push queues
    # behind it, which is right: the newer run deploys the newer code.
    concurrency:
      group: edge-functions-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The confirmation below asks git when the function's source last
          # changed. A shallow clone answers "HEAD" for every path, which on
          # 2026-09-15 failed three deploys of commits that never touched the
          # function. The script now refuses to run shallow.
          fetch-depth: 0

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — the function cannot be deployed."
            exit 1
          fi
          supabase functions deploy "$FUNCTION_SLUG" --project-ref "$PROJECT_REF"

      - name: Confirm the deploy landed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The commit main pointed at before this push. The deploy has to be
          # fresh only if the function changed since then: for an identical
          # bundle the CLI answers "No change found" and the deploy time
          # rightly stays put. A manual run has no such commit and gets the
          # drift comparison alone.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 .github/scripts/edge_function_drift.py --require-fresh-if-changed-since "$BEFORE_SHA"
          else
            python3 .github/scripts/edge_function_drift.py
          fi

  drift:
    name: drift check
    # Not on Dependabot PRs: such runs get no SUPABASE_ACCESS_TOKEN (GitHub
    # withholds repository secrets from them), so the check fails before it
    # reaches Supabase. The paths filter includes this workflow file, which
    # is exactly what an actions bump edits.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'pull_request')
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check compares the deploy timestamp against the last commit
          # that touched the function, so it needs real history, not a
          # single-commit shallow clone.
          fetch-depth: 0

      - name: Compare production against main
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/edge_function_drift.py
