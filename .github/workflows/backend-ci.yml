name: Backend CI

# Triggers on every push to main and every PR targeting main, without a
# top-level `paths:` filter. The `detect-changes` job below decides
# whether the heavy work (lint, tests, schema smoke) actually runs based
# on a diff of changed files. The aggregator job `Backend CI Pass` always
# runs and reports a single stable check name, which is what the branch
# ruleset requires. This avoids the fallback-workflow gymnastics: one
# workflow, one check name, no concurrency collisions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Determines whether any backend-relevant file changed in this push or PR.
  # The heavy jobs gate on this output so docs-only PRs don't burn CI minutes.
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect backend-relevant changes
        id: filter
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            # event.before is 0000... when a branch is being created. main
            # always has parents, so fall back to the first parent of HEAD.
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi
          fi
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^backend/|^\.github/workflows/backend-ci\.yml$'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Backend changes detected — heavy jobs will run."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes — heavy jobs will be skipped."
          fi
          # The schema-replay job validates that supabase/schema.sql still
          # loads from scratch. Run it when the committed schema, the CI
          # bootstrap, the migrations, or this workflow change.
          if echo "$CHANGED" | grep -qE '^supabase/schema\.sql$|^supabase/ci/|^supabase/migrations/|^\.github/workflows/backend-ci\.yml$'; then
            echo "schema=true" >> "$GITHUB_OUTPUT"
            echo "Schema-relevant changes detected — replay job will run."
          else
            echo "schema=false" >> "$GITHUB_OUTPUT"
            echo "No schema changes — replay job will be skipped."
          fi

  lint-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ vars.CI_SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-not-real' }}
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'ci-only-jwt-secret-not-for-production-use-min-32' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # pip-audit scans the runtime requirements against the PyPA advisory db.
      # --strict makes CI fail on any advisory; --ignore-vuln can be added below
      # with a justification (and optional expiry comment) when a fix isn't yet
      # available upstream. We audit requirements.txt (runtime) rather than
      # requirements-ci.txt to avoid noise from dev-only deps.
      - name: Audit runtime dependencies with pip-audit
        run: pip-audit --requirement requirements.txt --strict

      # scripts/ is in scope deliberately. Everything in there talks to
      # the production database — it repairs live rows, audits the live
      # catalogue, applies monitors — and it was the one directory no
      # check ever read. It had been sitting unformatted for as long as
      # nobody looked.
      - name: Lint with Ruff
        run: ruff check app/ tests/ scripts/

      - name: Check formatting with Ruff
        run: ruff format app/ tests/ scripts/ --check

      # Static type check — covers the entire app/ directory (mypy.ini).
      - name: Type-check with mypy
        run: mypy --config-file mypy.ini

      - name: Verify main entrypoint syntax
        run: python -m py_compile app/main.py

      - name: Compile all application modules
        run: python -m compileall app/ -q

      - name: Verify FastAPI application imports
        run: 'python -c "from app.main import app; print(''OK: FastAPI app imports successfully'')"'

      - name: Run tests with coverage
        # -n auto (pytest-xdist) fans tests out across all runner cores;
        # pytest-cov combines coverage across xdist workers out of the box.
        run: >-
          python -m pytest tests/
          -vv
          -n auto
          --tb=short
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --strict-markers

      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() || failure()
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn

      # Upload to Codecov. Public repos with branch protection require
      # an explicit token (tokenless uploads are rejected by Codecov when
      # the target branch is protected); we read it from the
      # `CODECOV_TOKEN` repo secret. `fail_ci_if_error: false` keeps the
      # gate stable if Codecov has an outage -- the artifact above is the
      # durable backup.
      - name: Upload coverage to Codecov (backend)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Postgres schema smoke test — validates that the SQLAlchemy models can
  # materialize a valid schema against real Postgres (not just SQLite).
  # This is our cheapest guard against model/prod drift: if a column type or
  # constraint would fail under Postgres, we catch it in CI before deploy.
  # The production schema itself is managed by Supabase migrations (applied
  # via the Supabase CLI / MCP), not from this workflow.
  # ---------------------------------------------------------------------------
  schema-smoke-postgres:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-real
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-use-min-32

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ci; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Create schema from SQLAlchemy models and verify core tables
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect

          import app.models  # noqa: F401 — side-effect: registers every model
          from app.core.database import Base

          engine = create_engine("postgresql://ci:ci@localhost:5432/ci?sslmode=disable")
          Base.metadata.create_all(bind=engine)

          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {
              "profiles",
              "courses",
              "modules",
              "chapters",
              "chapter_blocks",
              "enrollments",
              "chapter_progress",
              "quizzes",
              "quiz_questions",
              "quiz_options",
              "quiz_attempts",
              "quiz_answers",
              "quiz_extra_attempts",
              "assignments",
              "assignment_submissions",
              "certificates",
              "cohorts",
              "course_reviews",
              "course_prerequisites",
              "course_events",
              "announcements",
              "student_grades",
              "audit_logs",
              "notifications",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Schema-smoke failed: missing tables on Postgres: {sorted(missing)}")
          print(f"OK: {len(tables)} tables materialized from models, all {len(required)} required tables present")
          PY

  # ---------------------------------------------------------------------------
  # Schema replay from scratch. Loads the committed `supabase/schema.sql`
  # (a faithful pg_dump of the production public schema) into a clean
  # Postgres 17, after stubbing the Supabase-managed primitives the dump
  # references (auth schema + roles). This proves the schema is reproducible
  # from the committed artifact — the DR "can we rebuild prod from zero?"
  # guarantee — and turns any out-of-band prod drift into a visible diff on
  # schema.sql in the PR that regenerates it. Complements schema-smoke
  # (models -> Postgres); this is (prod dump -> Postgres).
  # ---------------------------------------------------------------------------
  schema-replay-postgres:
    needs: detect-changes
    if: needs.detect-changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ci; then exit 0; fi
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Replay schema.sql from scratch
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          PSQL="psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U ci -d ci"
          echo "::group::Bootstrap Supabase primitives"
          $PSQL -f supabase/ci/replay_bootstrap.sql
          echo "::endgroup::"
          echo "::group::Load production schema dump"
          $PSQL -f supabase/schema.sql
          echo "::endgroup::"

      - name: Verify table count matches prod
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          COUNT=$(psql -tA -h localhost -p 5432 -U ci -d ci \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "public base tables after replay: $COUNT"
          # Prod has 46 public base tables (see schema.sql) — 38, plus the five
          # rubric tables and submission_declarations (2026-08-12), plus
          # legal_acceptances (2026-08-13), plus staged_content_versions
          # (2026-08-17). Guard against a silently-truncated dump or a
          # partial load.
          #
          # Worth knowing what this guard does NOT catch: it counts tables, so
          # the four certificate-letterhead COLUMNS added to prod on
          # 2026-08-13 were missing from schema.sql for a day without anything
          # going red. Regenerating the dump is the step that catches column
          # drift, and it is not optional after a prod change.
          if [ "$COUNT" -ne 46 ]; then
            echo "::error::Expected 46 public tables after replay, got $COUNT — schema.sql may be stale or partial." >&2
            exit 1
          fi
          echo "OK: prod schema replays cleanly from supabase/schema.sql"

  # ---------------------------------------------------------------------------
  # RLS policy + privilege test. Recreates the prod schema + RLS policies +
  # GRANTs on a clean Postgres, then probes it AS the `authenticated` role to
  # prove forbidden direct writes are actually rejected (self-approve a
  # certificate, tamper a quiz score, write a grade, escalate one's own role)
  # and a legitimate own-row write still succeeds. The app-layer tests override
  # auth, so this is the only thing that exercises the real RLS/grant boundary
  # a migration could regress.
  # ---------------------------------------------------------------------------
  rls-policy-postgres:
    needs: detect-changes
    if: needs.detect-changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ci; then exit 0; fi
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Recreate prod RLS surface and assert as authenticated
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          PSQL="psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U ci -d ci"
          echo "::group::Bootstrap roles + configurable auth.uid()"
          $PSQL -f supabase/ci/rls_bootstrap.sql
          echo "::endgroup::"
          echo "::group::Load prod schema (structure + RLS policies + triggers)"
          $PSQL -f supabase/schema.sql
          echo "::endgroup::"
          echo "::group::Apply prod GRANTs to the client roles"
          $PSQL -f supabase/ci/rls_grants.sql
          echo "::endgroup::"
          echo "::group::Probe as authenticated"
          $PSQL -f supabase/ci/rls_assertions.sql
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Required-check aggregator. This single job is what the branch ruleset
  # requires on every PR. It always runs (independent of detect-changes
  # output) and reports a single stable check name. When backend files were
  # not touched it auto-passes; when they were, it mirrors the result of
  # the heavy jobs above.
  # ---------------------------------------------------------------------------
  backend-ci-pass:
    name: Backend CI Pass
    needs: [detect-changes, lint-and-test, schema-smoke-postgres, schema-replay-postgres, rls-policy-postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify backend CI outcome
        run: |
          set -e
          DC="${{ needs.detect-changes.result }}"
          CHANGED="${{ needs.detect-changes.outputs.backend }}"
          SCHEMA="${{ needs.detect-changes.outputs.schema }}"
          LT="${{ needs.lint-and-test.result }}"
          SS="${{ needs.schema-smoke-postgres.result }}"
          SR="${{ needs.schema-replay-postgres.result }}"
          RLS="${{ needs.rls-policy-postgres.result }}"
          echo "detect-changes=$DC"
          echo "backend_changed=$CHANGED"
          echo "schema_changed=$SCHEMA"
          echo "lint-and-test=$LT"
          echo "schema-smoke-postgres=$SS"
          echo "schema-replay-postgres=$SR"
          echo "rls-policy-postgres=$RLS"
          # detect-changes is the gate that decides whether the heavy
          # jobs run. If detect-changes itself failed (network flake,
          # checkout error, bad diff) we cannot conclude "no backend
          # change" — we'd silently auto-pass a PR that should have
          # been gated. Fail loudly instead.
          if [ "$DC" != "success" ]; then
            echo "::error::detect-changes did not succeed (result=$DC); cannot auto-pass."
            exit 1
          fi
          if [ "$CHANGED" != "true" ] && [ "$SCHEMA" != "true" ]; then
            echo "No backend or schema changes — auto-pass."
            exit 0
          fi
          # When backend code changed, lint-and-test + schema-smoke must pass.
          if [ "$CHANGED" = "true" ] && { [ "$LT" != "success" ] || [ "$SS" != "success" ]; }; then
            echo "::error::Backend CI failed (lint-and-test=$LT, schema-smoke=$SS)."
            exit 1
          fi
          # When schema artifacts changed, the from-scratch replay AND the
          # RLS-policy probe must pass.
          if [ "$SCHEMA" = "true" ] && [ "$SR" != "success" ]; then
            echo "::error::Schema replay failed (schema-replay-postgres=$SR)."
            exit 1
          fi
          if [ "$SCHEMA" = "true" ] && [ "$RLS" != "success" ]; then
            echo "::error::RLS policy probe failed (rls-policy-postgres=$RLS)."
            exit 1
          fi
          echo "All required backend CI jobs succeeded."
